services:
  vaultbridge:
    build: .
    image: vaultbridge:latest
    container_name: vaultbridge
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "8728:8728"
    environment:
      VAULTBRIDGE_HOST: 0.0.0.0
      VAULTBRIDGE_PORT: 8728
      VAULTBRIDGE_DATA_DIR: /app/data
      TZ: Asia/Shanghai
      # Set this once in production. Do not commit real keys.
      BACKUP_SECRET_KEY: ${BACKUP_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
      # Set VAULTBRIDGE_BACKUP_HOST_DIR in .env to your real NAS backup folder.
      - ${VAULTBRIDGE_BACKUP_HOST_DIR:-./backups}:/服务器备份
      # Compatibility mount for older jobs and English examples.
      - ${VAULTBRIDGE_BACKUP_HOST_DIR:-./backups}:/server-backups
