[project]
name = "vaultbridge"
version = "0.1.0"
description = "A simple web panel for read-only SSH backups into a Git-versioned NAS folder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10.4",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "paramiko>=3.4.0",
  "pydantic>=2.7.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

