[project]
name = "vaultbridge"
version = "0.1.0"
description = "A simple web panel for read-only SSH backups into a Git-versioned NAS folder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler==3.11.3",
  "bcrypt==5.0.0",
  "cryptography==49.0.0",
  "fastapi==0.139.0",
  "paramiko==5.0.0",
  "pydantic==2.13.4",
  "pynacl==1.6.2",
  "uvicorn[standard]==0.51.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
